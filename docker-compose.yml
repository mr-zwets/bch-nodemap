# Production-style stack (VPS). For local development without Docker see README.md.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: nodemap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: nodemap
    volumes:
      - pgdata:/var/lib/postgresql/data
      # applied once, on first start of an empty volume
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

  crawler:
    build: ./crawler
    command: ["-network", "mainnet", "-interval", "10m"]
    environment:
      DATABASE_URL: postgres://nodemap:${POSTGRES_PASSWORD}@db:5432/nodemap
      GEOIP_CITY: /geoip/dbip-city-lite.mmdb
      GEOIP_ASN: /geoip/dbip-asn-lite.mmdb
    volumes:
      - ./.local/geoip:/geoip:ro  # filled by scripts/geoip.sh
    depends_on: [db]
    restart: unless-stopped

  # web: added once web/ has a Dockerfile

volumes:
  pgdata:
